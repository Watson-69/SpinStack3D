<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="SpinStack 3D logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="platter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="60%" stop-color="#1f1f26"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </radialGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff6b5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- concentric platters -->
  <g transform="translate(200,200)">
    <circle r="150" fill="url(#platter)" stroke="#2a2a32" stroke-width="1"/>
    <circle r="120" fill="none" stroke="#3a3a44" stroke-width="1"/>
    <circle r="90" fill="none" stroke="#3a3a44" stroke-width="1"/>
    <circle r="60" fill="none" stroke="#3a3a44" stroke-width="1"/>
    <circle r="30" fill="#0f0f12" stroke="#ff3b30" stroke-width="2" filter="url(#glow)"/>

    <!-- spinning platter highlight -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <path d="M0,-140 A140,140 0 0,1 99,-99" fill="none" stroke="url(#red)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="-140" r="4" fill="#ff3b30" filter="url(#glow)"/>
    </g>

    <!-- actuator arm -->
    <g transform="rotate(-30)">
      <rect x="-6" y="-160" width="12" height="120" rx="6" fill="#2a2a32" stroke="#4a4a54" stroke-width="1"/>
      <rect x="-14" y="-45" width="28" height="14" rx="3" fill="url(#red)" filter="url(#glow)"/>
      <circle cx="0" cy="-160" r="10" fill="#1f1f26" stroke="#ff3b30" stroke-width="2"/>
    </g>
  </g>

  <!-- title -->
  <text x="200" y="360" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4">SPINSTACK 3D</text>
  <text x="200" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff3b30" letter-spacing="2">ENTERPRISE HDD EXPLORER</text>
</svg>
